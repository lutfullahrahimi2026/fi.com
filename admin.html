<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Faizani International</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23173a32'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23b99557'/%3E%3C/svg%3E" />
</head>
<body>

<!-- LOGIN VIEW -->
<div class="admin-login-wrap" id="loginView" hidden>
  <form class="admin-login-card" id="loginForm">
    <span class="section-label">Admin</span>
    <h1 style="font-size: 28px; margin-top: 6px;">Sign in</h1>
    <div class="form-field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="username" />
    </div>
    <div class="form-field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required autocomplete="current-password" />
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
    <p class="section-desc" id="loginStatus" role="status"></p>
  </form>
</div>

<!-- DASHBOARD VIEW -->
<div class="admin-dashboard" id="dashboardView" hidden>
  <header class="admin-topbar">
    <a href="index.html" class="logo"><span class="mark"></span> Faizani<span class="logo-full"> Admin</span></a>
    <div class="admin-topbar-actions">
      <span id="adminWhoAmI"></span>
      <button type="button" class="btn btn-secondary btn-sm" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <nav class="admin-tabs" id="adminTabs">
    <button type="button" class="admin-tab is-active" data-tab="books">Books</button>
    <button type="button" class="admin-tab" data-tab="events">Events</button>
    <button type="button" class="admin-tab" data-tab="submissions">Submissions</button>
    <button type="button" class="admin-tab" data-tab="admins">Admins</button>
  </nav>

  <main class="admin-main">

    <!-- BOOKS PANEL -->
    <section class="admin-panel is-active" id="panel-books">
      <div class="admin-panel-head">
        <h2>Books &amp; Publications</h2>
        <button type="button" class="btn btn-primary btn-sm" id="newBookBtn">Add Book</button>
      </div>

      <form class="admin-form" id="bookForm" hidden>
        <input type="hidden" id="bookId" />
        <div class="admin-form-row">
          <div class="form-field">
            <label for="bookTitle">Title</label>
            <input type="text" id="bookTitle" required />
          </div>
          <div class="form-field">
            <label for="bookSlug">Slug</label>
            <input type="text" id="bookSlug" placeholder="url-safe-slug" required />
          </div>
        </div>
        <div class="admin-form-row">
          <div class="form-field">
            <label for="bookSeries">Series</label>
            <input type="text" id="bookSeries" list="bookSeriesOptions" required />
            <datalist id="bookSeriesOptions"></datalist>
          </div>
          <div class="form-field">
            <label for="bookSeriesLabel">Series Label (optional)</label>
            <input type="text" id="bookSeriesLabel" placeholder="e.g. Book 1, Volume" />
          </div>
        </div>
        <div class="admin-form-row">
          <div class="form-field">
            <label for="bookAuthor">Author</label>
            <input type="text" id="bookAuthor" required />
          </div>
          <div class="form-field">
            <label for="bookLanguage">Language</label>
            <input type="text" id="bookLanguage" required />
          </div>
        </div>
        <div class="form-field">
          <label for="bookDescription">Short Description</label>
          <textarea id="bookDescription" required style="min-height: 70px;"></textarea>
        </div>
        <div class="form-field">
          <label for="bookLongDescription">Long Description</label>
          <textarea id="bookLongDescription" required></textarea>
        </div>
        <div class="form-field">
          <label for="bookTopics">Topics (comma-separated)</label>
          <input type="text" id="bookTopics" placeholder="Faith, Self-Knowledge" />
        </div>
        <div class="form-field">
          <label for="bookToc">Table of Contents (one item per line, optional)</label>
          <textarea id="bookToc" style="min-height: 90px;"></textarea>
        </div>

        <div class="admin-form-row" id="bookUploadRow" hidden>
          <div class="form-field">
            <label for="bookCoverFile">Cover Image (jpg/png/webp)</label>
            <input type="file" id="bookCoverFile" accept=".jpg,.jpeg,.png,.webp" />
          </div>
          <div class="form-field">
            <label for="bookPdfFile">PDF File</label>
            <input type="file" id="bookPdfFile" accept=".pdf" />
          </div>
        </div>

        <div class="admin-form-actions">
          <button type="submit" class="btn btn-primary">Save Book</button>
          <button type="button" class="btn btn-secondary" id="cancelBookBtn">Cancel</button>
        </div>
        <p class="section-desc" id="bookFormStatus" role="status"></p>
      </form>

      <div class="admin-table-wrap">
        <table class="admin-table" id="booksTable">
          <thead>
            <tr><th>Title</th><th>Series</th><th>Slug</th><th>PDF</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- EVENTS PANEL -->
    <section class="admin-panel" id="panel-events">
      <div class="admin-panel-head">
        <h2>Events</h2>
        <button type="button" class="btn btn-primary btn-sm" id="newEventBtn">Add Event</button>
      </div>

      <form class="admin-form" id="eventForm" hidden>
        <input type="hidden" id="eventId" />
        <div class="form-field">
          <label for="eventTitle">Title</label>
          <input type="text" id="eventTitle" required />
        </div>
        <div class="form-field">
          <label for="eventDescription">Description</label>
          <textarea id="eventDescription" required style="min-height: 90px;"></textarea>
        </div>
        <div class="admin-form-row">
          <div class="form-field">
            <label for="eventDate">Date</label>
            <input type="date" id="eventDate" required />
          </div>
          <div class="form-field">
            <label for="eventTime">Time (optional)</label>
            <input type="text" id="eventTime" placeholder="e.g. 6:00 PM" />
          </div>
        </div>
        <div class="admin-form-row">
          <div class="form-field">
            <label for="eventLocation">Location (optional)</label>
            <input type="text" id="eventLocation" />
          </div>
          <div class="form-field">
            <label for="eventRegistrationUrl">Registration URL (optional)</label>
            <input type="url" id="eventRegistrationUrl" placeholder="https://forms.gle/..." />
          </div>
        </div>
        <div class="form-field">
          <label><input type="checkbox" id="eventPublished" /> Published (visible on the public Events page)</label>
        </div>
        <div class="admin-form-actions">
          <button type="submit" class="btn btn-primary">Save Event</button>
          <button type="button" class="btn btn-secondary" id="cancelEventBtn">Cancel</button>
        </div>
        <p class="section-desc" id="eventFormStatus" role="status"></p>
      </form>

      <div class="admin-table-wrap">
        <table class="admin-table" id="eventsTable">
          <thead>
            <tr><th>Title</th><th>Date</th><th>Published</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- SUBMISSIONS PANEL -->
    <section class="admin-panel" id="panel-submissions">
      <div class="admin-panel-head">
        <h2>Form Submissions</h2>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="submissionsTable">
          <thead>
            <tr><th>Type</th><th>From</th><th>Subject / Detail</th><th>Received</th><th>Read</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- ADMINS PANEL -->
    <section class="admin-panel" id="panel-admins">
      <div class="admin-panel-head">
        <h2>Admin Accounts</h2>
        <button type="button" class="btn btn-primary btn-sm" id="newAdminBtn">Add Admin</button>
      </div>

      <form class="admin-form" id="adminForm" hidden>
        <div class="admin-form-row">
          <div class="form-field">
            <label for="newAdminName">Name</label>
            <input type="text" id="newAdminName" required />
          </div>
          <div class="form-field">
            <label for="newAdminEmail">Email</label>
            <input type="email" id="newAdminEmail" required />
          </div>
        </div>
        <div class="form-field">
          <label for="newAdminPassword">Password (min. 8 characters)</label>
          <input type="password" id="newAdminPassword" minlength="8" required />
        </div>
        <div class="admin-form-actions">
          <button type="submit" class="btn btn-primary">Create Admin</button>
          <button type="button" class="btn btn-secondary" id="cancelAdminBtn">Cancel</button>
        </div>
        <p class="section-desc" id="adminFormStatus" role="status"></p>
      </form>

      <div class="admin-table-wrap">
        <table class="admin-table" id="adminsTable">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Created</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/admin/auth.js"></script>
<script src="js/admin/books.js"></script>
<script src="js/admin/events.js"></script>
<script src="js/admin/submissions.js"></script>
<script src="js/admin/admins.js"></script>
</body>
</html>
